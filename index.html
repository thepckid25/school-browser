<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clean Spotify Browser</title>
    <style>
        /* Design & Styling */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #control-bar {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #1f1f1f;
            gap: 15px;
            height: 80px;
            box-sizing: border-box;
        }
        #url-input {
            flex-grow: 1;
            background: #333;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        #go-btn {
            background: #1DB954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .divider {
            width: 1px;
            height: 40px;
            background: #444;
        }
        #spotify-container {
            width: 300px;
            height: 60px;
        }
        #spotify-player {
            border: none;
            border-radius: 8px;
            width: 100%;
            height: 100%;
        }
        #web-view {
            flex-grow: 1;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <!-- Top Control Bar Layout -->
    <div id="control-bar">
        <input type="text" id="url-input" value="https://youtube.com" placeholder="Enter website URL...">
        <button id="go-btn">Go</button>
        <div class="divider"></div>
        <div id="spotify-container">
            <iframe id="spotify-player" src="https://spotify.com" allow="encrypted-media"></iframe>
        </div>
    </div>

    <!-- Web Browser Frame -->
    <iframe id="web-view" src="https://youtube.com"></iframe>

    <!-- Browser Logic -->
    <script>
        const urlInput = document.getElementById('url-input');
        const goBtn = document.getElementById('go-btn');
        const webView = document.getElementById('web-view');

        // Handle Browser Navigation
        goBtn.addEventListener('click', () => {
            let url = urlInput.value;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            webView.src = url;
        });

        // Press Enter to Go
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') goBtn.click();
        });
    </script>
</body>
</html>
